name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
      - name: Check required architecture records
        run: |
          test -f docs/research.md
          test -f docs/architecture.md
          test -f docs/adr/0001-runtime-architecture.md
          test -f docs/adr/0002-popup-focus-model.md
          test -f docs/adr/0003-emoji-data-source.md
          test -f docs/adr/0004-ipc-protocol.md
