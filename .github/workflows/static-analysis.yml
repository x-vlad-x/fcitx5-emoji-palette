name: Static analysis

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora@sha256:a0cddd3b24c82a88ab33d16bac3415e8b66d78a9e2901a16a1d6ba3865bec97e
    steps:
      - name: Install analysis dependencies
        run: >
          dnf install -y clang clang-tools-extra cmake ninja-build gcc-c++
          python3 git reuse fcitx5-devel qt6-qtbase-devel qt6-linguist
          layer-shell-qt-devel
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check formatting
        run: |
          find include src tests -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 |
            xargs -0 clang-format --dry-run --Werror
      - name: Check REUSE compliance
        run: reuse lint
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build analysis targets
        run: cmake --build build --parallel 2
      - name: Run clang-tidy
        run: >
          run-clang-tidy -p build -quiet
          '^(?!.*(?:_autogen|/\.qt/)).*/(?:src|tests)/.*\.cpp$'
