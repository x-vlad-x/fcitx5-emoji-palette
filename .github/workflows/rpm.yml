name: RPM

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rpm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fedora-44:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora@sha256:a0cddd3b24c82a88ab33d16bac3415e8b66d78a9e2901a16a1d6ba3865bec97e
    steps:
      - name: Install packaging dependencies
        run: >
          dnf install -y cmake dbus-daemon dbus-tools desktop-file-utils
          fcitx5-devel gcc-c++ git google-noto-color-emoji-fonts libappstream-glib
          layer-shell-qt-devel ninja-build procps-ng python3 qt6-linguist
          qt6-qtbase-devel qt6-qttools-devel reuse rpm-build rpmlint
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Create source archive
        run: |
          mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          git archive \
            --format=tar.gz \
            --prefix=fcitx5-emoji-palette-0.1.0-rc.1/ \
            --output=rpmbuild/SOURCES/v0.1.0-rc.1.tar.gz \
            HEAD
          cp packaging/fedora/fcitx5-emoji-palette.spec rpmbuild/SPECS/
      - name: Build RPM and SRPM
        run: >
          rpmbuild -ba
          --define "_topdir $PWD/rpmbuild"
          rpmbuild/SPECS/fcitx5-emoji-palette.spec
      - name: Run rpmlint
        run: >
          rpmlint
          rpmbuild/SPECS/fcitx5-emoji-palette.spec
          rpmbuild/SRPMS/*.src.rpm
          rpmbuild/RPMS/*/*.rpm
      - name: Test packaged installation
        run: |
          dnf install -y \
            rpmbuild/RPMS/*/fcitx5-emoji-palette-0.1.0~rc1-1.fc44.*.rpm
          test -x /usr/libexec/fcitx5-emoji-palette-ui
          test -f /usr/share/fcitx5/addon/emojipalette.conf
          test -f /usr/share/dbus-1/services/org.fcitx.Fcitx5.EmojiPalette1.service
          fcitx5 -D --disable=all --enable=keyboard,dbus,emojipalette \
            --verbose '*'=5 >fcitx.log 2>&1 &
          fcitx_pid=$!
          for attempt in {1..20}; do
            if grep -q "Call loadAddon() with emojipalette" fcitx.log; then
              break
            fi
            sleep 0.25
          done
          grep -q "Call loadAddon() with emojipalette" fcitx.log
          kill -0 "$fcitx_pid"
          ! grep -E "Failed to load addon: emojipalette|Failed to load library.*emoji" fcitx.log
          kill "$fcitx_pid"
          wait "$fcitx_pid" || true
          QT_QPA_PLATFORM=minimal dbus-run-session -- bash -euo pipefail -c '
            gdbus introspect \
              --session \
              --dest org.fcitx.Fcitx5.EmojiPalette1 \
              --object-path /org/fcitx/Fcitx5/EmojiPalette1 >introspection.txt
            grep -q "Exchange" introspection.txt
            grep -q "Frame" introspection.txt
            helper_pid="$(pgrep -f "^/usr/libexec/fcitx5-emoji-palette-ui$")"
            kill "$helper_pid"
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fedora-44-rpms
          path: |
            rpmbuild/RPMS/*/*.rpm
            rpmbuild/SRPMS/*.src.rpm
