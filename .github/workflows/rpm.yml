name: RPM

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rpm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fedora-44:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora@sha256:a0cddd3b24c82a88ab33d16bac3415e8b66d78a9e2901a16a1d6ba3865bec97e
    steps:
      - name: Install packaging dependencies
        run: >
          dnf install -y cmake dbus-daemon dbus-tools desktop-file-utils
          fcitx5 fcitx5-devel gcc-c++ git google-noto-color-emoji-fonts libappstream-glib
          libxkbcommon-devel layer-shell-qt-devel ninja-build procps-ng python3 qt6-linguist
          qt6-qtbase-devel qt6-qttools-devel reuse rpm-build rpmlint
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Configure repository ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Create source archive
        run: |
          mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          git archive \
            --format=tar.gz \
            --prefix=fcitx5-emoji-palette-0.1.0-rc.2/ \
            --output=rpmbuild/SOURCES/v0.1.0-rc.2.tar.gz \
            HEAD
          cp packaging/fedora/fcitx5-emoji-palette.spec rpmbuild/SPECS/
      - name: Build RPM and SRPM
        run: |
          rpmbuild -ba \
            --define "_topdir $PWD/rpmbuild" \
            rpmbuild/SPECS/fcitx5-emoji-palette.spec
      - name: Run rpmlint
        run: >
          rpmlint
          rpmbuild/SPECS/fcitx5-emoji-palette.spec
          rpmbuild/SRPMS/*.src.rpm
          rpmbuild/RPMS/*/*.rpm
      - name: Test packaged installation
        run: |
          package_path=$(
            printf '%s\n' \
              rpmbuild/RPMS/*/fcitx5-emoji-palette-0.1.0~rc2-3.fc44.*.rpm
          )
          rpm -qp --requires "$package_path" | grep -Fq 'libxkbcommon.so.0()(64bit)'
          dnf install -y "$package_path"
          package_nevra=$(rpm -q fcitx5-emoji-palette)
          for installed_path in \
            /usr/lib64/fcitx5/libemoji-palette.so \
            /usr/libexec/fcitx5-emoji-palette-ui \
            /usr/share/fcitx5/addon/emojipalette.conf \
            /usr/share/dbus-1/services/org.fcitx.Fcitx5.EmojiPalette1.service; do
            test "$(rpm -qf "$installed_path")" = "$package_nevra"
          done
          tests/packaged_runtime_smoke.sh
          dnf remove -y fcitx5-emoji-palette
          test ! -e /usr/lib64/fcitx5/libemoji-palette.so
          test ! -e /usr/libexec/fcitx5-emoji-palette-ui
          tests/packaged_runtime_smoke.sh --fcitx-only
          dnf install -y "$package_path"
          tests/packaged_runtime_smoke.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fedora-44-rpms
          path: |
            rpmbuild/RPMS/*/*.rpm
            rpmbuild/SRPMS/*.src.rpm
