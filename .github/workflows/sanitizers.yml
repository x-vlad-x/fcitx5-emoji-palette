name: Sanitizers

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan-ubsan:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora@sha256:a0cddd3b24c82a88ab33d16bac3415e8b66d78a9e2901a16a1d6ba3865bec97e
    steps:
      - name: Install build dependencies
        run: dnf install -y cmake ninja-build gcc-c++ python3 git libasan libubsan
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure
